<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob:;style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; object-src 'none'"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f4f8;
        color: #4a5568;
        font-family: Arial, sans-serif;
        font-weight: 500;
        transition: opacity 0.5s ease-in-out;
      }
      #app {
        display: none;
        opacity: 0;
      }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .spinner {
        animation: rotate 2s linear infinite;
        margin-bottom: 20px;
        width: 60px;
        height: 60px;
      }
      .spinner .path {
        stroke: #4a5568;
        stroke-linecap: round;
        animation: dash 1.5s ease-in-out infinite;
      }
      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes dash {
        0% {
          stroke-dasharray: 1, 150;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -35;
        }
        100% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -124;
        }
      }
    </style>
  </head>

  <body>
    <div id="loading-initial" class="loading-screen">
      <svg class="spinner" viewBox="0 0 50 50">
        <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
      </svg>
      <p>Caricamento in corso...</p>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
